{% extends "layout.html"%}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <form action="/register" method="post">
        <div class="mb-3">
            <input autocomplete="off" class="form-control mx-auto w-auto"  autofocus name="username" placeholder="username" type="test"></div>
        <div class="mb-3">
            <input autocomplete="off" class="form-control mx-auto w-auto"  autofocus name="password" placeholder="password" type="password">
        </div>
        <div class="mb-3">
            <input autocomplete="off" class="form-control mx-auto w-auto"  autofocus name="confirmation" placeholder="password(again)" type="password">
        </div>
            <button type="submit" class="btn btn-primary">Register</button>
    </form>
{% endblock %}
